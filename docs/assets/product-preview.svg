<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Purify desktop preview</title>
  <desc id="desc">A preview of Purify showing disk usage, safe cleanup suggestions, and a reversible quarantine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151827"/>
      <stop offset=".55" stop-color="#20213A"/>
      <stop offset="1" stop-color="#0E2730"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7967FF"/>
      <stop offset="1" stop-color="#1499FF"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#72E5A4"/>
      <stop offset="1" stop-color="#2CCB83"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#060711" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="30" fill="url(#bg)"/>
  <circle cx="1020" cy="-30" r="280" fill="#0A84FF" opacity=".08"/>
  <circle cx="80" cy="740" r="260" fill="#7C5CFF" opacity=".09"/>

  <rect x="34" y="34" width="1132" height="652" rx="24" fill="#FFFFFF" fill-opacity=".075" stroke="#FFFFFF" stroke-opacity=".14" filter="url(#shadow)"/>
  <rect x="34" y="34" width="235" height="652" rx="24" fill="#0B0E18" fill-opacity=".55"/>
  <rect x="269" y="34" width="1" height="652" fill="#FFFFFF" fill-opacity=".1"/>

  <rect x="64" y="66" width="38" height="38" rx="11" fill="url(#accent)"/>
  <path d="M83 75c5.2 5.6 9.2 9.8 9.2 15.2a9.2 9.2 0 1 1-18.4 0C73.8 84.8 77.8 80.6 83 75Z" fill="#fff" opacity=".92"/>
  <text x="115" y="91" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">Purify</text>
  <text x="64" y="145" fill="#8C93A8" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="700" letter-spacing="1.3">LIBRARY</text>
  <rect x="54" y="164" width="196" height="45" rx="12" fill="url(#accent)"/>
  <text x="102" y="192" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="600">Disk Map</text>
  <text x="102" y="246" fill="#A2A8BA" font-family="Inter,Segoe UI,sans-serif" font-size="15">Cleanup</text>
  <text x="102" y="292" fill="#A2A8BA" font-family="Inter,Segoe UI,sans-serif" font-size="15">Quarantine</text>
  <rect x="64" y="580" width="176" height="72" rx="14" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".12"/>
  <text x="80" y="606" fill="#A2A8BA" font-family="Inter,Segoe UI,sans-serif" font-size="12">Startup disk</text>
  <text x="80" y="631" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="600">68% used · 128 GB free</text>
  <rect x="80" y="640" width="144" height="5" rx="3" fill="#FFFFFF" fill-opacity=".14"/>
  <rect x="80" y="640" width="98" height="5" rx="3" fill="url(#safe)"/>

  <text x="314" y="96" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="27" font-weight="700">See what is filling your disk.</text>
  <text x="314" y="127" fill="#A2A8BA" font-family="Inter,Segoe UI,sans-serif" font-size="15">C:\ · 421 GB scanned · 24,812 files</text>
  <rect x="314" y="158" width="815" height="210" rx="18" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".12"/>
  <text x="338" y="190" fill="#A2A8BA" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="600">LARGEST CONSUMERS</text>
  <rect x="338" y="215" width="360" height="125" rx="14" fill="url(#accent)"/>
  <text x="360" y="250" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="700">86.4 GB</text>
  <text x="360" y="278" fill="#fff" fill-opacity=".85" font-family="Inter,Segoe UI,sans-serif" font-size="14">Users\Mahdi\AppData</text>
  <rect x="710" y="215" width="195" height="125" rx="14" fill="#22B7A5"/>
  <text x="732" y="250" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">42.1 GB</text>
  <text x="732" y="278" fill="#fff" fill-opacity=".85" font-family="Inter,Segoe UI,sans-serif" font-size="14">Projects</text>
  <rect x="917" y="215" width="188" height="125" rx="14" fill="#3B3E57"/>
  <text x="939" y="250" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">18.7 GB</text>
  <text x="939" y="278" fill="#fff" fill-opacity=".85" font-family="Inter,Segoe UI,sans-serif" font-size="14">Downloads</text>

  <rect x="314" y="394" width="815" height="240" rx="18" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".12"/>
  <text x="338" y="427" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="650">Safe cleanup, with a way back</text>
  <rect x="338" y="449" width="756" height="58" rx="12" fill="#FFFFFF" fill-opacity=".06"/>
  <circle cx="369" cy="478" r="15" fill="url(#safe)"/>
  <path d="m362 478 5 5 9-11" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="396" y="474" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="600">Browser caches</text>
  <text x="396" y="494" fill="#A2A8BA" font-family="Inter,Segoe UI,sans-serif" font-size="12">Safe · explainable · 4.8 GB reclaimable</text>
  <text x="1040" y="482" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700" text-anchor="end">Clean</text>
  <rect x="338" y="518" width="756" height="58" rx="12" fill="#FFFFFF" fill-opacity=".06"/>
  <circle cx="369" cy="547" r="15" fill="#FFB340"/>
  <text x="396" y="543" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="600">Old build artifacts</text>
  <text x="396" y="563" fill="#A2A8BA" font-family="Inter,Segoe UI,sans-serif" font-size="12">Likely safe · review before moving · 12.2 GB</text>
  <text x="1040" y="551" fill="#A2A8BA" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="600" text-anchor="end">Review</text>
</svg>
