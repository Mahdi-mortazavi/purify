[package]
name = "purify-ntfs"
description = "Isolated raw NTFS/volume access for purify. The ONLY crate permitted to use unsafe, confined to opening a volume handle and reading raw sectors."
# Internal crate — not published to crates.io (yet). Keeps path deps legal.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
purify-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
# NTFS structure parsing is safe and portable (no_std-friendly), so it compiles
# and is unit-tested on every platform against a filesystem image. Our own
# unsafe surface is confined to acquiring a raw volume handle on Windows.
ntfs = "0.4"

[dev-dependencies]
flate2 = "1"
tempfile = "3"

# Windows-only: raw volume access. We open `\\.\C:` for reading. A read-only
# volume handle can be obtained with std::fs, keeping unsafe out of the open
# path; the `windows` crate is reserved for aligned raw-sector reads if needed.
[target.'cfg(windows)'.dependencies]
# windows = { version = "0.62", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_IO"] }

# This crate deliberately does NOT inherit the workspace lint table, because it
# is the single sanctioned home for `unsafe`. Every other lint is mirrored;
# only `unsafe_code` is relaxed from `forbid` to `deny` with per-block
# `#[allow(unsafe_code)]` + a `// SAFETY:` comment required at each use site.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
undocumented_unsafe_blocks = "warn"
