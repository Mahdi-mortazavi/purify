<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purify</title>
  <style>
    :root {
      --bg: #0b0f10;
      --panel: #12181a;
      --panel-2: #1a2226;
      --text: #e6edf0;
      --muted: #8aa0a8;
      --accent: #0d9488;
      --accent-2: #14b8a6;
      --safe: #22c55e;
      --likely: #eab308;
      --review: #f97316;
      --border: #22303a;
      --danger: #ef4444;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f7f8; --panel: #ffffff; --panel-2: #eef2f4;
        --text: #0b1417; --muted: #55707a; --border: #dde5e9;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
    }
    .app { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
    header {
      display: flex; align-items: center; gap: 12px; padding: 14px 18px;
      background: var(--panel); border-bottom: 1px solid var(--border);
    }
    .logo { font-weight: 700; font-size: 18px; letter-spacing: .5px; }
    .logo span { color: var(--accent-2); }
    input[type=text] {
      flex: 1; background: var(--panel-2); border: 1px solid var(--border);
      color: var(--text); padding: 9px 12px; border-radius: 8px; font-size: 14px;
    }
    button {
      background: var(--accent); color: #fff; border: none; padding: 9px 14px;
      border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    button.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
    button.danger { background: var(--danger); }
    button:disabled { opacity: .5; cursor: default; }
    button:hover:not(:disabled) { filter: brightness(1.08); }

    .guardbar { padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 14px; font-size: 13px; }
    .meter { flex: 1; height: 10px; background: var(--panel-2); border-radius: 6px; overflow: hidden; }
    .meter > div { height: 100%; background: linear-gradient(90deg, var(--safe), var(--likely), var(--review));
      transition: width .35s cubic-bezier(.2,.8,.2,1); }
    .pill { padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .pill.ok { background: rgba(34,197,94,.18); color: var(--safe); }
    .pill.warning { background: rgba(234,179,8,.18); color: var(--likely); }
    .pill.critical { background: rgba(239,68,68,.2); color: var(--danger); }

    main { display: grid; grid-template-columns: 1.3fr 1fr; gap: 0; min-height: 0; }
    .col { min-height: 0; display: flex; flex-direction: column; }
    .col + .col { border-left: 1px solid var(--border); }
    .col h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
      margin: 0; padding: 14px 18px 8px; display: flex; justify-content: space-between; align-items: center; }
    .scroll { overflow-y: auto; padding: 6px 18px 18px; }

    /* Promote the treemap to its own GPU compositor layer for smooth scrolling
       and transform animations (WebView2 hardware-accelerates these). */
    .treemap { display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start;
      transform: translateZ(0); }
    .tile { border-radius: 8px; padding: 10px; color: #fff; overflow: hidden;
      background: var(--accent); display: flex; flex-direction: column; justify-content: space-between;
      min-height: 54px; will-change: transform;
      /* Animate only compositor-friendly properties (transform/box-shadow),
         never layout-triggering ones, so hover stays at 60fps on the GPU. */
      transition: transform .15s ease, box-shadow .15s ease;
      animation: tile-in .18s ease both; }
    .tile:hover { transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 20px rgba(0,0,0,.35); z-index: 1; }
    .tile small { opacity: .85; font-size: 11px; word-break: break-all; }
    .tile b { font-size: 13px; }
    @keyframes tile-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .tile { animation: none; transition: none; }
    }

    .item { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px; margin-bottom: 10px; }
    .item .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .item .path { font-size: 13px; word-break: break-all; }
    .item .reason { font-size: 12px; color: var(--muted); margin-top: 5px; }
    .badge { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
    .badge.safe { background: rgba(34,197,94,.18); color: var(--safe); }
    .badge.likely-safe { background: rgba(234,179,8,.18); color: var(--likely); }
    .badge.review-needed { background: rgba(249,115,22,.18); color: var(--review); }
    .size { font-variant-numeric: tabular-nums; font-weight: 700; }
    .actions { display: flex; gap: 8px; padding: 0 18px 14px; }
    .empty { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
    .tabbtn { background: transparent; color: var(--muted); border: none; padding: 4px 8px; font-weight: 700; }
    .tabbtn.active { color: var(--accent-2); }
    .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
      padding: 10px 16px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s;
      pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">purify<span>·</span></div>
      <input id="path" type="text" placeholder="Path to scan (e.g. C:\Users\me)" value="C:\" />
      <button id="scanBtn">Scan</button>
      <button id="analyzeBtn" class="ghost">Analyze</button>
    </header>

    <div class="guardbar">
      <span id="guardText" class="muted">Disk: —</span>
      <div class="meter"><div id="guardMeter" style="width:0%"></div></div>
      <span id="guardPill" class="pill ok">—</span>
    </div>

    <main>
      <div class="col">
        <h2>Disk map <span id="scanTotal" class="muted"></span></h2>
        <div class="scroll"><div id="treemap" class="treemap">
          <div class="empty">Enter a path and press Scan to see what fills your disk.</div>
        </div></div>
      </div>

      <div class="col">
        <h2>
          <span>
            <button class="tabbtn active" id="tabSuggest">Suggestions</button>
            <button class="tabbtn" id="tabQuarantine">Quarantine</button>
          </span>
          <span id="reclaimTotal" class="muted"></span>
        </h2>
        <div class="actions" id="cleanActions" style="display:none">
          <button id="cleanSafe">Clean safe items</button>
          <button id="cleanLikely" class="ghost">Include likely-safe</button>
        </div>
        <div class="scroll"><div id="list">
          <div class="empty">Press Analyze to get safe cleanup suggestions.</div>
        </div></div>
      </div>
    </main>
  </div>
  <div id="toast" class="toast"></div>

  <script>
    const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);
    const $ = (id) => document.getElementById(id);
    let view = "suggest";
    let lastAnalysis = null; // cache so the Suggestions tab can re-render cheaply

    // Escape text before inserting into innerHTML. File names/paths can contain
    // `&`, `<`, `>` which would otherwise corrupt rendering or break markup.
    function esc(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function fmtBytes(n) {
      const u = ["B","KiB","MiB","GiB","TiB","PiB"]; let i = 0; let v = n;
      while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
      return i === 0 ? `${n} B` : `${v.toFixed(2)} ${u[i]}`;
    }
    function toast(msg) {
      const t = $("toast"); t.textContent = msg; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2200);
    }
    function pathVal() { return $("path").value.trim(); }

    async function refreshGuard() {
      try {
        const r = await invoke("guard_path", { path: pathVal() });
        const pct = Math.round(r.used_fraction * 100);
        $("guardText").textContent =
          `${fmtBytes(r.space.available)} free of ${fmtBytes(r.space.total)}`;
        $("guardMeter").style.width = pct + "%";
        const pill = $("guardPill");
        pill.textContent = `${pct}% used · ${r.pressure}`;
        pill.className = "pill " + r.pressure;
      } catch (e) {
        // Reset the meter/pill so a failed refresh doesn't look like healthy
        // stale data.
        $("guardText").textContent = "Disk: " + e;
        $("guardMeter").style.width = "0%";
        const pill = $("guardPill");
        pill.textContent = "—";
        pill.className = "pill ok";
      }
    }

    async function doScan() {
      const btn = $("scanBtn"); btn.disabled = true; btn.textContent = "Scanning…";
      try {
        const rep = await invoke("scan_path", { path: pathVal(), top: 24 });
        $("scanTotal").textContent = `${fmtBytes(rep.total_bytes)} · ${rep.file_count} files`;
        renderTreemap(rep);
        refreshGuard();
      } catch (e) { toast("Scan failed: " + e); }
      finally { btn.disabled = false; btn.textContent = "Scan"; }
    }

    function renderTreemap(rep) {
      const box = $("treemap"); box.innerHTML = "";
      if (!rep.top.length) { box.innerHTML = '<div class="empty">Nothing found.</div>'; return; }
      const max = rep.top[0].size || 1;
      for (const c of rep.top) {
        const frac = c.size / max;
        const el = document.createElement("div");
        el.className = "tile";
        const basis = Math.max(90, Math.round(frac * 320));
        el.style.flex = `1 1 ${basis}px`;
        el.style.background = c.is_dir ? "var(--accent)" : "var(--panel-2)";
        if (!c.is_dir) el.style.color = "var(--text)";
        const name = c.path.split(/[\\/]/).pop() || c.path;
        el.innerHTML = `<b>${fmtBytes(c.size)}</b><small>${esc(name)}</small>`;
        box.appendChild(el);
      }
    }

    async function doAnalyze() {
      const btn = $("analyzeBtn"); btn.disabled = true; btn.textContent = "Analyzing…";
      try {
        const rep = await invoke("analyze_path", { path: pathVal() });
        lastAnalysis = rep;
        view = "suggest"; setTab();
        renderSuggestions(rep);
      } catch (e) { toast("Analyze failed: " + e); }
      finally { btn.disabled = false; btn.textContent = "Analyze"; }
    }

    function renderSuggestions(rep) {
      const list = $("list"); list.innerHTML = "";
      $("cleanActions").style.display = rep.suggestions.length ? "flex" : "none";
      $("reclaimTotal").textContent = rep.suggestions.length
        ? `${fmtBytes(rep.total_reclaimable)} reclaimable` : "";
      if (!rep.suggestions.length) {
        list.innerHTML = '<div class="empty">No reclaimable items — this location looks tidy.</div>';
        return;
      }
      for (const s of rep.suggestions) {
        const el = document.createElement("div");
        el.className = "item";
        el.innerHTML = `
          <div class="row">
            <span class="badge ${s.confidence}">${s.confidence}</span>
            <span class="size">${fmtBytes(s.size)}</span>
          </div>
          <div class="path">${esc(s.path)}</div>
          <div class="reason">${esc(s.title)} — ${esc(s.reason)}</div>`;
        list.appendChild(el);
      }
    }

    async function doClean(minConfidence) {
      if (!confirm(`Move ${minConfidence} items to reversible quarantine? You can restore them anytime.`)) return;
      const btns = [$("cleanSafe"), $("cleanLikely")];
      btns.forEach((b) => (b.disabled = true));
      $("cleanSafe").textContent = "Cleaning…";
      try {
        const out = await invoke("clean_path", { path: pathVal(), minConfidence });
        toast(`Quarantined ${out.moved} item(s), reclaimed ${fmtBytes(out.reclaimed)}.`);
        await doAnalyze(); refreshGuard();
      } catch (e) { toast("Clean failed: " + e); }
      finally {
        btns.forEach((b) => (b.disabled = false));
        $("cleanSafe").textContent = "Clean safe items";
      }
    }

    async function renderQuarantine() {
      const list = $("list");
      $("cleanActions").style.display = "none";
      try {
        const items = await invoke("list_quarantine");
        $("reclaimTotal").textContent = items.length
          ? `${items.length} held` : "";
        if (!items.length) { list.innerHTML = '<div class="empty">Quarantine is empty.</div>'; return; }
        list.innerHTML = "";
        for (const i of items) {
          const el = document.createElement("div");
          el.className = "item";
          el.innerHTML = `
            <div class="row">
              <span class="size">${fmtBytes(i.size)}</span>
              <span>
                <button class="ghost" data-restore="${i.id}">Restore</button>
                <button class="danger" data-purge="${i.id}">Purge</button>
              </span>
            </div>
            <div class="path">${esc(i.original_path)}</div>
            <div class="reason">${esc(i.reason)}</div>`;
          list.appendChild(el);
        }
      } catch (e) { list.innerHTML = `<div class="empty">${e}</div>`; }
    }

    function setTab() {
      $("tabSuggest").classList.toggle("active", view === "suggest");
      $("tabQuarantine").classList.toggle("active", view === "quarantine");
      if (view === "quarantine") {
        renderQuarantine();
      } else if (lastAnalysis) {
        // Restore the suggestions view (list + clean actions + totals) that the
        // quarantine tab overwrote.
        renderSuggestions(lastAnalysis);
      } else {
        $("cleanActions").style.display = "none";
        $("reclaimTotal").textContent = "";
        $("list").innerHTML =
          '<div class="empty">Press Analyze to get safe cleanup suggestions.</div>';
      }
    }

    document.addEventListener("click", async (e) => {
      const r = e.target.getAttribute?.("data-restore");
      const p = e.target.getAttribute?.("data-purge");
      if (r) { try { await invoke("restore_item", { id: r }); toast("Restored."); renderQuarantine(); refreshGuard(); } catch (err) { toast("" + err); } }
      if (p) { if (confirm("Permanently delete this item? This cannot be undone.")) { try { await invoke("purge_item", { id: p }); toast("Purged."); renderQuarantine(); } catch (err) { toast("" + err); } } }
    });

    $("scanBtn").onclick = doScan;
    $("analyzeBtn").onclick = doAnalyze;
    $("cleanSafe").onclick = () => doClean("safe");
    $("cleanLikely").onclick = () => doClean("likely-safe");
    $("tabSuggest").onclick = () => { view = "suggest"; setTab(); };
    $("tabQuarantine").onclick = () => { view = "quarantine"; setTab(); };

    // Initial disk readout for the default path.
    refreshGuard();
  </script>
</body>
</html>
